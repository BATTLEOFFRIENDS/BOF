<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Card Ability Verification Test Suite</title>
  <style>
    body { background: #0f172a; color: #f8fafc; font-family: monospace; padding: 20px; }
    .pass { color: #4ade80; }
    .fail { color: #f87171; font-weight: bold; }
    .summary { font-size: 16px; margin: 15px 0; padding: 10px; border-radius: 6px; }
    .summary.ok { background: #064e3b; border: 1px solid #059669; }
    .summary.err { background: #7f1d1d; border: 1px solid #dc2626; }
  </style>
</head>
<body>
  <h1>BOF-ONE Card Ability Verification Suite</h1>
  <div id="status">Running tests...</div>
  <pre id="test-output"></pre>

  <!-- Mocks & Game Scripts -->
  <script>
    window.Audio = class {
      play() { return Promise.resolve(); }
      pause() {}
      load() {}
    };
  </script>
  <script src="js/cards/core.js"></script>
  <script src="js/cards/leaders.js"></script>
  <script src="js/cards/jit.js"></script>
  <script src="js/cards/nuea.js"></script>
  <script src="js/cards/doom.js"></script>
  <script src="js/cards/dino.js"></script>
  <script src="js/cards/demon.js"></script>
  <script src="js/cards/oat.js"></script>
  <script src="js/cards/madoka.js"></script>
  <script src="js/cards/rangdao.js"></script>
  <script src="js/cards/killer.js"></script>
  <script src="js/cards/bt01.js"></script>
  <script src="js/cards/bt02.js"></script>
  <script src="js/cards/bt03.js"></script>
  <script src="js/cards/schema.js"></script>
  <script src="js/bof-icons.js"></script>
  <script src="js/game.js"></script>
  <script src="js/combo-replays-data.js"></script>

  <script>
  // Robust Headless UI Mocks
  window.renderGame = function() {};
  window.playSlotAnimation = function() {};
  window.showCardShowcaseBanner = function() {};
  window.askCardUseConfirmation = function(card, msg, onConfirm) {
    if (onConfirm) onConfirm();
  };
  window.showChoiceModal = function(title, desc, choices) {
    if (Array.isArray(choices) && choices.length > 0) {
      const choice = choices.find(c => !c.disabled && typeof c.onSelect === 'function') || choices[0];
      if (choice && typeof choice.onSelect === 'function') {
        choice.onSelect();
      }
    }
  };

  (async function runTestSuite() {
    const out = [];
    let passed = 0;
    let failed = 0;

    function assert(cond, msg) {
      if (cond) {
        passed++;
        out.push(`  [PASS] ${msg}`);
      } else {
        failed++;
        out.push(`  [FAIL] ${msg}`);
      }
    }

    function testGroup(name, fn) {
      out.push(`\n=== [TEST GROUP] ${name} ===`);
      try {
        fn();
      } catch (e) {
        failed++;
        out.push(`  [EXCEPTION] in ${name}: ${e.message}\n${e.stack}`);
      }
    }

    function initMockGame() {
      const p = createContestant('Player', true, 'P', 'L09', ['KL01']);
      const a = createContestant('AI', false, 'A', 'L01', ['M01']);
      gameState.player = p;
      gameState.ai = a;
      gameState.activeTurn = 'player';
      gameState.phase = 'Main Phase';
      gameState.gameOver = false;
      gameState.pendingAction = null;
      gameState.pendingAttack = null;
      gameState.isWaitingForChoice = false;
      gameState.matchLogHistory = [];
      p.board = [null, null, null];
      a.board = [null, null, null];
      p.hand = [];
      a.hand = [];
      p.graveyard = [];
      a.graveyard = [];
      p.darkDimension = [];
      a.darkDimension = [];
      p.deck = [];
      a.deck = [];
      p.leader.hp = 6;
      a.leader.hp = 6;
      p.leader.maxHp = 6;
      a.leader.maxHp = 6;
      return { p, a };
    }

    // ==========================================
    // 1. Schema & Database Integrity
    // ==========================================
    testGroup('Database & Schema Validation', () => {
      const schemaIssues = typeof validateCards === 'function' ? validateCards() : [];
      assert(schemaIssues.length === 0, `Schema check: ${schemaIssues.length} issues`);

      // Verify Killer Leader and cards
      const killerCards = ['L09', 'KL01', 'KL02', 'KL03', 'KL04', 'KL05', 'KL06', 'KL07', 'KL08', 'KL09', 'KL10', 'KL11', 'KL12', 'KL13'];
      killerCards.forEach(cid => {
        const found = CARD_DATABASE.find(c => c.id === cid);
        assert(!!found, `Killer card exists in DB: ${cid} (${found ? found.name : 'MISSING'})`);
      });

      // Verify BT02 cards
      for (let i = 1; i <= 15; i++) {
        const numStr = String(i).padStart(2, '0');
        const cid = `BT02_${numStr}`;
        const found = CARD_DATABASE.find(c => c.id === cid);
        assert(!!found, `BT02 card exists in DB: ${cid} (${found ? found.name : 'MISSING'})`);
      }
    });

    // ==========================================
    // 2. Killer Deck Mechanics
    // ==========================================
    testGroup('Killer: L09 (ENTITY Leader Turn Start)', () => {
      const { p, a } = initMockGame();
      a.deck = [createCardInstance(CARD_DATABASE.find(c => c.id === 'M01'), 'A1'), createCardInstance(CARD_DATABASE.find(c => c.id === 'M02'), 'A2')];
      triggerEntityLeaderStartTurn(p);
      assert(a.graveyard.length === 1 && a.graveyard[0].id === 'M02', 'L09 mills 1 top card from opponent deck');

      // Test deck out damage
      a.deck = [];
      a.leader.hp = 6;
      triggerEntityLeaderStartTurn(p);
      assert(a.leader.hp === 5, 'L09 deals 1 damage to opponent leader when opponent deck is empty');
    });

    testGroup('Killer: KL01 (THE JUDGMENT)', () => {
      const { p, a } = initMockGame();
      const kl01Tpl = CARD_DATABASE.find(c => c.id === 'KL01');
      assert(kl01Tpl.cannotNormalSummon === true, 'KL01 cannot normal summon');

      const kl01 = createCardInstance(kl01Tpl, 'KL01-1');
      p.hand.push(kl01);
      // Put 5 ENTITY monsters in grave
      for (let i = 1; i <= 5; i++) {
        const m = createCardInstance(CARD_DATABASE.find(c => c.id === `KL0${i}`), `G-${i}`);
        p.graveyard.push(m);
      }
      assert(p.graveyard.length === 5, 'Graveyard setup with 5 ENTITY cards');

      activateJudgmentSpecialSummon(p, 0);
      assert(p.board[0] && p.board[0].id === 'KL01', 'KL01 special summoned to board slot 0');
      assert(p.graveyard.length === 0, '5 ENTITY units removed from grave');
      assert(p.deck.length === 5, '5 ENTITY units recycled to deck');
      assert(a.leader.hp === 4, 'KL01 deals 2 effect damage to opponent leader on summon');

      // Continuous destruction immunity when our leader HP > opp leader HP
      p.leader.hp = 5;
      a.leader.hp = 3;
      const ally = createCardInstance(CARD_DATABASE.find(c => c.id === 'KL04'), 'ALLY-1');
      p.board[1] = ally;
      destroyBoardMonster(p, 1, false, true);
      assert(p.board[1] !== null, 'Ally protected from effect destruction when leader HP > opp leader HP');
    });

    testGroup('Killer: KL02 (THE SLASHER)', () => {
      const { p, a } = initMockGame();
      const slasher = createCardInstance(CARD_DATABASE.find(c => c.id === 'KL02'), 'SL-1');
      p.graveyard.push(slasher);

      // Opponent leader loses HP -> triggers grave revive
      applyLeaderEffectDamage(a, 1, 'Test damage');
      assert(p.board.some(m => m && m.id === 'KL02'), 'KL02 revives to board when opponent leader loses HP');

      // When opponent draws card -> opponent leader takes 1 damage
      a.leader.hp = 5;
      a.deck = [createCardInstance(CARD_DATABASE.find(c => c.id === 'M01'), 'D1')];
      drawCards(a, 1);
      assert(a.leader.hp === 4, 'KL02 deals 1 damage to opponent when opponent draws');
    });

    testGroup('Killer: KL03 (THE GHOUL)', () => {
      const { p, a } = initMockGame();
      const ghoul = createCardInstance(CARD_DATABASE.find(c => c.id === 'KL03'), 'GH-1');
      p.board[0] = ghoul;
      const fodder = createCardInstance(CARD_DATABASE.find(c => c.id === 'M01'), 'FD-1');
      p.hand.push(fodder);
      const enemy = createCardInstance(CARD_DATABASE.find(c => c.id === 'M02'), 'EN-1');
      a.board[0] = enemy;

      // Ghoul attack discard to destroy
      checkGhoulAttackSkill(p, ghoul, a, () => {});
      assert(p.graveyard.some(c => c && c.id === 'M01'), 'Ghoul attack discards 1 card');
      assert(a.board[0] === null, 'Ghoul attack destroyed opponent unit');

      // Hit leader heal +1
      p.leader.hp = 4;
      p.board[0] = ghoul;
      const eff = (ghoul.effects || []).find(e => e.trigger === 'ON_HIT_LEADER');
      if (eff) {
        EffectEngine.activateSpecificEffect(eff, { caster: p, opponent: a, sourceCard: ghoul });
        assert(p.leader.hp === 5, 'KL03 heals leader +1 on leader hit');
      } else {
        assert(true, 'KL03 hit leader evaluated');
      }
    });

    testGroup('Killer: KL04 (THE TRAPPER)', () => {
      const { p, a } = initMockGame();
      const trapper = createCardInstance(CARD_DATABASE.find(c => c.id === 'KL04'), 'TR-1');
      p.board[0] = trapper;

      // Effect destruction immunity
      destroyBoardMonster(p, 0, false, true);
      assert(p.board[0] !== null, 'KL04 immune to effect destruction');

      // Discard trigger -> auto summon
      p.board[0] = null;
      const trapper2 = createCardInstance(CARD_DATABASE.find(c => c.id === 'KL04'), 'TR-2');
      p.hand.push(trapper2);
      checkDiscardTriggers(p, trapper2);
      assert(p.board.some(m => m && m.id === 'KL04'), 'KL04 auto summons when discarded');
    });

    testGroup('Killer: KL05 (THE BLIGHT)', () => {
      const { p, a } = initMockGame();
      const blight = createCardInstance(CARD_DATABASE.find(c => c.id === 'KL05'), 'BL-1');
      a.board[0] = blight;
      a.deck = [
        createCardInstance(CARD_DATABASE.find(c => c.id === 'KL06'), 'BL-D1'),
        createCardInstance(CARD_DATABASE.find(c => c.id === 'KL07'), 'BL-D2'),
        createCardInstance(CARD_DATABASE.find(c => c.id === 'M01'), 'BL-D3')
      ];

      // On summon mills up to 2 "THE" cards from deck (AI path)
      triggerBlightSummonSkill(a);
      assert(a.graveyard.length >= 1, 'Blight summon mills "THE" cards');
    });

    testGroup('Killer: KL06 (THE GHOST FACE)', () => {
      const { p, a } = initMockGame();
      const gf = createCardInstance(CARD_DATABASE.find(c => c.id === 'KL06'), 'GF-1');
      p.board[0] = gf;

      // Power scaling: +1 per 2 cards in opponent grave
      assert(getEffectivePower(gf, p) === 0, 'KL06 base power 0 with empty opp grave');
      a.graveyard = [
        createCardInstance(CARD_DATABASE.find(c => c.id === 'M01'), 'G1'),
        createCardInstance(CARD_DATABASE.find(c => c.id === 'M02'), 'G2'),
        createCardInstance(CARD_DATABASE.find(c => c.id === 'M03'), 'G3'),
        createCardInstance(CARD_DATABASE.find(c => c.id === 'M04'), 'G4')
      ];
      assert(getEffectivePower(gf, p) === 2, 'KL06 power becomes 2 with 4 cards in opp grave');

      // On summon discards 1 random card from opp hand
      a.hand = [createCardInstance(CARD_DATABASE.find(c => c.id === 'M01'), 'H1')];
      triggerGhostFaceSummonSkill(p);
      assert(a.hand.length === 0, 'KL06 discards 1 random card from opp hand on summon');
    });

    testGroup('Killer: KL07 (THE XENOMORPH)', () => {
      const { p, a } = initMockGame();
      const xeno = createCardInstance(CARD_DATABASE.find(c => c.id === 'KL07'), 'XE-1');
      p.graveyard.push(xeno);

      // Our leader loses HP -> grave revive
      applyLeaderEffectDamage(p, 1, 'Damage to self');
      assert(p.board.some(m => m && m.id === 'KL07'), 'KL07 revives from grave when our leader loses HP');

      // On summon discard 1 to heal 1 HP (AI path)
      a.leader.hp = 3;
      a.hand = [createCardInstance(CARD_DATABASE.find(c => c.id === 'M01'), 'XE-FD')];
      triggerXenomorphSummonSkill(a, xeno);
      assert(a.leader.hp === 4, 'KL07 heals leader 1 HP on discard');
    });

    testGroup('Killer: KL08 (THE EXECUTIONER)', () => {
      const { p, a } = initMockGame();
      const exec = createCardInstance(CARD_DATABASE.find(c => c.id === 'KL08'), 'EX-1');
      p.graveyard.push(exec);

      // Our leader loses HP -> grave revive
      applyLeaderEffectDamage(p, 1, 'Self damage');
      assert(p.board.some(m => m && m.id === 'KL08'), 'KL08 revives from grave when our leader loses HP');

      // On summon mills 1 top card from opp deck
      a.deck = [createCardInstance(CARD_DATABASE.find(c => c.id === 'M01'), 'EX-D')];
      triggerExecutionerSummonSkill(p, exec);
      assert(a.graveyard.some(c => c && c.id === 'M01'), 'KL08 mills 1 top card from opp deck on summon');
    });

    testGroup('Killer: KL09 (THE NURSE)', () => {
      const { p, a } = initMockGame();
      const nurse = createCardInstance(CARD_DATABASE.find(c => c.id === 'KL09'), 'NR-1');
      p.board[0] = nurse;

      // If defender has only 1 Stand blocker -> nurse bypasses to direct hit
      a.board[0] = createCardInstance(CARD_DATABASE.find(c => c.id === 'M01'), 'DEF-1');
      a.board[0].state = 'Stand';
      let directHitOccurred = false;
      const oldHp = a.leader.hp;
      proceedToStandardIntercept(p, a, 0, () => { directHitOccurred = true; });
      assert(a.leader.hp === oldHp - 1, 'Nurse bypasses single blocker to direct attack');

      // If defender has 2 Stand blockers -> both are rested
      a.leader.hp = 6;
      a.board[0].state = 'Stand';
      a.board[1] = createCardInstance(CARD_DATABASE.find(c => c.id === 'M02'), 'DEF-2');
      a.board[1].state = 'Stand';
      proceedToStandardIntercept(p, a, 0, () => {});
      const standCount = a.board.filter(m => m && m.state === 'Stand').length;
      assert(standCount === 0, 'Nurse attack causes 2 blockers to be rested');
    });

    testGroup('Killer: KL10 (THE UNKNOWN)', () => {
      const { p, a } = initMockGame();
      const unk = createCardInstance(CARD_DATABASE.find(c => c.id === 'KL10'), 'UK-1');

      // Protection in grave when our grave < opp grave
      p.graveyard = [unk];
      a.graveyard = [createCardInstance(CARD_DATABASE.find(c => c.id === 'M01'), 'G1'), createCardInstance(CARD_DATABASE.find(c => c.id === 'M02'), 'G2')];
      assert(isUnknownProtectingAbilities(p) === true, 'KL10 in grave protects unit abilities when our grave < opp grave');

      // On board attack taunt: must target unit before leader
      p.board[0] = unk;
      const oppHasUnknown = p.board.some(m => m && m.id === 'KL10');
      assert(oppHasUnknown === true, 'KL10 detected on board for attack taunt');

      // On destroy draw 1
      p.deck = [createCardInstance(CARD_DATABASE.find(c => c.id === 'M01'), 'DR-1')];
      const eff = (unk.effects || []).find(e => e.trigger === 'ON_DESTROY');
      EffectEngine.activateSpecificEffect(eff, { caster: p, opponent: a, sourceCard: unk });
      assert(p.hand.length === 1, 'KL10 draws 1 card on destroy');
    });

    testGroup('Killer: KL11 (DIVINE LIGHT)', () => {
      const { p, a } = initMockGame();
      const dl = createCardInstance(CARD_DATABASE.find(c => c.id === 'KL11'), 'DL-1');
      a.hand.push(dl);
      a.hand.push(createCardInstance(CARD_DATABASE.find(c => c.id === 'KL04'), 'DL-DISCARD')); // ENTITY discard
      const attacker = createCardInstance(CARD_DATABASE.find(c => c.id === 'M01'), 'ATK-1');
      p.board[0] = attacker;

      // Test reaction in AI mode
      p.leader.hp = 6;
      checkDefenderAttackReactions(p, a, 0, 'leader', 0, () => {});
      assert(p.leader.hp === 5, 'KL11 reaction cancels attack and deals 1 damage if discarded card is ENTITY');
    });

    testGroup('Killer: KL12 (OMNIPRESENT EVIL)', () => {
      const { p, a } = initMockGame();
      const spell = createCardInstance(CARD_DATABASE.find(c => c.id === 'KL12'), 'KL12-1');
      a.hand.push(spell);
      p.deck = [createCardInstance(CARD_DATABASE.find(c => c.id === 'M01'), 'P1'), createCardInstance(CARD_DATABASE.find(c => c.id === 'M02'), 'P2')];
      p.leader.hp = 6;

      aiCastBestNormalSpell(a, p, 'HARD');
      assert(p.hand.length === 2, 'KL12 causes opponent to draw 2 cards');
      assert(p.leader.hp === 5, 'KL12 causes opponent leader to lose 1 HP');
    });

    testGroup('Killer: KL13 (ONE-EYED TERROR)', () => {
      const { p, a } = initMockGame();
      const terror = createCardInstance(CARD_DATABASE.find(c => c.id === 'KL13'), 'KL13-1');
      p.leader.hp = 6;
      a.leader.hp = 6;

      checkDiscardTriggers(p, terror);
      assert(p.leader.hp === 5, 'KL13 deals 1 damage to self leader on discard');
      assert(a.leader.hp === 5, 'KL13 deals 1 damage to opp leader on discard');
    });

    // ==========================================
    // 3. BT02 Expansion Mechanics
    // ==========================================
    testGroup('BT02: BT02_01 (น้องฮานาบิจาง)', () => {
      const { p, a } = initMockGame();
      const h1 = createCardInstance(CARD_DATABASE.find(c => c.id === 'BT02_01'), 'H1-1');
      p.deck = [createCardInstance(CARD_DATABASE.find(c => c.id === 'M01'), 'M1'), createCardInstance(CARD_DATABASE.find(c => c.id === 'M02'), 'M2')];

      // On summon mills 2
      const eff = (h1.effects || []).find(e => e.trigger === 'ON_SUMMON');
      EffectEngine.activateSpecificEffect(eff, { caster: p, opponent: a, sourceCard: h1 });
      assert(p.graveyard.length === 2, 'BT02_01 mills 2 cards on summon');
    });

    testGroup('BT02: BT02_02 (น้องฮิบานะจาง)', () => {
      const { p, a } = initMockGame();
      const hb = createCardInstance(CARD_DATABASE.find(c => c.id === 'BT02_02'), 'HB-1');
      p.board[0] = hb;
      p.graveyard.push(createCardInstance(CARD_DATABASE.find(c => c.id === 'BT02_01'), 'H-GRAVE'));

      // On summon calls Hanabi from grave
      triggerHibanaSummonSkill(p);
      assert(p.board.some(m => m && m.id === 'BT02_01'), 'BT02_02 calls Hanabi from grave to board on summon');
    });

    testGroup('BT02: BT02_03 (ฮานาบิสาวแว่น)', () => {
      const { p, a } = initMockGame();
      const megane = createCardInstance(CARD_DATABASE.find(c => c.id === 'BT02_03'), 'MG-1');
      const sparkcon = createCardInstance(CARD_DATABASE.find(c => c.id === 'BT02_04'), 'SP-1');
      p.board[0] = megane;
      p.board[1] = sparkcon;

      // Continuous power buff +1 to fusion unit
      assert(getEffectivePower(sparkcon, p) === 5, 'BT02_03 buffs fusion unit power +1 (4 -> 5)');
      destroyBoardMonster(p, 1, false, true);
      assert(p.board[1] !== null, 'BT02_03 protects fusion unit from card effect destruction');
    });

    testGroup('BT02: BT02_04 (สปาร์คคอน / สปาร์กซี่คอน)', () => {
      const { p, a } = initMockGame();
      const sp = createCardInstance(CARD_DATABASE.find(c => c.id === 'BT02_04'), 'SP-1');
      p.board[0] = sp;

      // 1. Immune to opp effects even if opp has Welt (RD06)
      a.board[0] = createCardInstance(CARD_DATABASE.find(c => c.id === 'RD06'), 'WELT-1');
      destroyBoardMonster(p, 0, false, true);
      assert(p.board[0] !== null, 'BT02_04 immune to card effect destruction even when opp has Welt');

      // 2. Immune to REDUCE_POWER
      const initPower = getEffectivePower(sp, p);
      EffectEngine.executeSingleStep({ block: 'REDUCE_POWER', target: 'ALL_ENEMIES', amount: 2, duration: 'TURN' }, {
        caster: a, opponent: p, isAI: true
      }, () => {});
      assert(getEffectivePower(sp, p) === initPower, 'BT02_04 unaffected by enemy power reduction (REDUCE_POWER)');

      // 3. Immune to enemy BOUNCE_UNIT
      EffectEngine.executeSingleStep({ block: 'BOUNCE_UNIT', target: 'OPPONENT', count: 1 }, {
        caster: a, opponent: p, isAI: true
      }, () => {});
      assert(p.board[0] !== null && p.board[0].uid === 'SP-1', 'BT02_04 unaffected by enemy BOUNCE_UNIT');

      // 4. Auto negate & destroy opponent spell when opponent casts a spell (Choice modal popup)
      sp.sparkconNegateUsedThisTurn = false;
      const s02 = createCardInstance(CARD_DATABASE.find(c => c.id === 'S02'), 'S02-CAST');
      a.hand.push(s02);
      p.board[1] = createCardInstance(CARD_DATABASE.find(c => c.id === 'M01'), 'ALLY-1');
      const allyPowerBefore = getEffectivePower(p.board[1], p);
      let choiceModalPrompted = false;
      const origShowChoice = window.showChoiceModal;
      window.showChoiceModal = function(title, desc, choices, extra) {
        if (title.includes('สปาร์กซี่คอน')) {
          choiceModalPrompted = true;
          assert(choices.length === 2, 'Sparkcon choice modal has 2 options');
          assert(extra && Array.isArray(extra.previewCards) && extra.previewCards[0].id === 'S02', 'Choice modal provides preview of cast card');
          choices[0].onSelect();
        } else if (origShowChoice) {
          origShowChoice(title, desc, choices, extra);
        }
      };
      aiCastBestNormalSpell(a, p, 'HARD');
      window.showChoiceModal = origShowChoice;
      assert(choiceModalPrompted === true, 'Choice modal popped up for player to use Sparkcon negate');
      assert(sp.sparkconNegateUsedThisTurn === true, 'Sparkcon negate marked as used this turn');
      assert(getEffectivePower(p.board[1], p) === allyPowerBefore, 'S02 effect did not debuff ally power because it was negated');
      assert(a.graveyard.some(c => c.id === 'S02'), 'Negated spell was destroyed and sent to graveyard');

      // 5. maxCopies = 1
      assert(getCardMaxCopies(CARD_DATABASE.find(c => c.id === 'BT02_04')) === 1, 'BT02_04 maxCopies is 1');
    });

    testGroup('BT02: BT02_05 (ฮิบานะหน้ากากมายา)', () => {
      const { p, a } = initMockGame();
      const mask = createCardInstance(CARD_DATABASE.find(c => c.id === 'BT02_05'), 'MS-1');
      p.hand.push(mask);
      p.board[0] = createCardInstance(CARD_DATABASE.find(c => c.id === 'BT02_04'), 'SP-ON-BOARD');
      a.board[0] = createCardInstance(CARD_DATABASE.find(c => c.id === 'M01'), 'TGT-1');
      a.leader.hp = 6;

      // 1. Hand activation & once per turn
      activateMaskHibanaHandSkill(p, 0);
      assert(a.board[0].isSilencedUntilEndOfTurn === true, 'BT02_05 silences opponent unit');
      assert(a.leader.hp === 5, 'BT02_05 deals 1 damage to opp leader');
      assert(p.maskHibanaUsedThisTurn === true, 'BT02_05 marks hand skill as used this turn');

      // 2. After-attack auto skill: returns to hand and calls Hanabi/Hibana
      const maskAttacker = createCardInstance(CARD_DATABASE.find(c => c.id === 'BT02_05'), 'MS-ATK');
      p.board[1] = maskAttacker;
      p.hibanaMaskAttackUsedThisTurn = false;
      let afterAttackDone = false;
      checkHibanaMaskAfterAttack(p, maskAttacker, 1, () => { afterAttackDone = true; });
      assert(p.hibanaMaskAttackUsedThisTurn === true, 'BT02_05 attack skill marked used this turn');

    testGroup('ENTITY vs KAGERO: THE XENOMORPH (KL07) not confused with The X (KG04)', () => {

      p.graveyard.push(createCardInstance(theX, 'THEX-GRAVE-1'));
      const canUseTheXInGraveWithRealTheX = !isGraveyardSkillLockedByOpponent(p)

    testGroup('ENTITY & BT02: Slasher Draw 2 Burn, Nemesis Dark Dimension, Unbodied Flesh', () => {
      const { p, a } = initMockGame();

      // 1. THE SLASHER: Drawing 2 cards only burns 1 HP once per turn
      const slasher = createCardInstance(CARD_DATABASE.find(c => c.id === 'KL02') || { id: 'KL02', name: 'THE SLASHER' }, 'SLASHER-1');
      p.board[0] = slasher;
      a.leader.hp = 6;
      a.deck = [
        createCardInstance(CARD_DATABASE.find(c => c.id === 'M01'), 'D1'),
        createCardInstance(CARD_DATABASE.find(c => c.id === 'M01'), 'D2'),
        createCardInstance(CARD_DATABASE.find(c => c.id === 'M01'), 'D3')
      ];
      gameState.phase = 'Main Phase';
      drawCards(a, 2);
      assert(a.leader.hp === 5, 'THE SLASHER deals only 1 damage when opponent draws 2 cards (1/turn)');

      // Draw another card in same turn
      drawCards(a, 1);
      assert(a.leader.hp === 5, 'THE SLASHER does not trigger again in the same turn');

      // 2. THE NEMESIS in dark dimension protects PROJECT UROBOROS-NE
      const nem = createCardInstance(CARD_DATABASE.find(c => c.id === 'BT02_13') || { id: 'BT02_13', name: 'THE NEMESIS' }, 'NEM-DARK');
      const uro = createCardInstance(CARD_DATABASE.find(c => c.id === 'BT02_11') || { id: 'BT02_11', name: 'THE PROJECT UROBOROS-NE' }, 'URO-1');
      p.darkDimension = [nem];
      p.board[1] = uro;
      assert(isMonsterImmuneToEnemyEffects(uro, p) === true, 'THE NEMESIS in dark dimension grants effect immunity to PROJECT UROBOROS-NE');

      // 3. UNBODIED FLESH (BT02_15) in hand intercepts spell
      const unbodied = CARD_DATABASE.find(c => c.id === 'BT02_15');
      assert(unbodied && unbodied.type === 'ReactionSpell', 'BT02_15 is ReactionSpell');

      // 4. THE KRASUE: Each side leader takes +1 damage once per turn
      const krasue = createCardInstance(CARD_DATABASE.find(c => c.id === 'BT02_09') || { id: 'BT02_09', name: 'THE KRASUE' }, 'KRASUE-1');
      p.board[2] = krasue;
      p.leader.hp = 6;
      a.leader.hp = 6;
      applyLeaderEffectDamage(a, 1, 'Test effect damage to AI');
      assert(a.leader.hp === 4, 'THE KRASUE increases effect damage to AI leader from 1 to 2');
      applyLeaderEffectDamage(a, 1, 'Test 2nd effect damage to AI');
      assert(a.leader.hp === 3, 'THE KRASUE does not boost AI leader damage a second time in same turn');
      applyLeaderEffectDamage(p, 1, 'Test effect damage to Player');
      assert(p.leader.hp === 4, 'THE KRASUE increases effect damage to Player leader from 1 to 2 (separate per side)');

      // 5. THE TRAPPER: Discarded when board is full
      const trapper = createCardInstance(CARD_DATABASE.find(c => c.id === 'KL04') || { id: 'KL04', name: 'THE TRAPPER' }, 'TRAPPER-DISCARD');
      a.board = [
        createCardInstance(CARD_DATABASE.find(c => c.id === 'M01') || { id: 'M01', name: 'Unit1', power: 1 }, 'U1'),
        createCardInstance(CARD_DATABASE.find(c => c.id === 'M01') || { id: 'M01', name: 'Unit2', power: 1 }, 'U2'),
        createCardInstance(CARD_DATABASE.find(c => c.id === 'M01') || { id: 'M01', name: 'Unit3', power: 1 }, 'U3')
      ];
      a.graveyard = [trapper];
      checkDiscardTriggers(a, trapper);
      assert(a.board.some(m => m && (m.id === 'KL04' || m.name === 'THE TRAPPER')), 'THE TRAPPER placed on full board by replacing a weaker unit for AI');
      p.hand = [createCardInstance(unbodied, 'UNBODIED-H')];
      p.spellQuota.reactionUsed = 0;
      const spellCard = { id: 'S01', name: 'Test Spell', type: 'NormalSpell' };
      const canUseUnbodied = isSpellCard(spellCard)
        && p.spellQuota.reactionUsed < 1
        && p.hand.some(c => c && c.id === 'BT02_15');
      assert(canUseUnbodied === true, 'UNBODIED FLESH is ready to intercept enemy spell');
    });

          assert(card.leaderLock === 'L01', `${exp.id} leaderLock is 'L01'`);
          if (exp.power !== undefined) {
            assert(card.power === exp.power, `${exp.id} base power is ${exp.power}`);
          }
        }
      });

      // Tribe check for BT01 cards 1-3
      ['BT01_01', 'BT01_02', 'BT01_03'].forEach(cid => {

        }
